<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votação - Fila Rápida</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bibliotecas do Firebase (Versão 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Cabeçalho -->
    <header class="bg-blue-800 text-white shadow-md">
        <div class="max-w-3xl mx-auto p-4 text-center">
            <h1 class="text-2xl font-bold mb-4">Controle de Fluxo - Eleição</h1>
            <div class="flex justify-between space-x-2 bg-blue-900 p-1 rounded-lg">
                <button onclick="switchTab('aba1')" id="btn-aba1" class="flex-1 py-3 text-lg font-semibold rounded-md bg-white text-blue-800 transition-colors">1. Fila</button>
                <button onclick="switchTab('aba2')" id="btn-aba2" class="flex-1 py-3 text-lg font-semibold rounded-md text-white hover:bg-blue-700 transition-colors">2. Caderno</button>
                <button onclick="switchTab('aba3')" id="btn-aba3" class="flex-1 py-3 text-lg font-semibold rounded-md text-white hover:bg-blue-700 transition-colors">3. Urna</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 mt-4">
        <!-- ABA 1: INSERÇÃO -->
        <section id="aba1" class="tab-content active bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">Entrada de Eleitor</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Nome Completo</label>
                    <input type="text" id="inputNome" autocomplete="off" placeholder="Ex: Maria da Silva" 
                           class="w-full p-4 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Título de Eleitor (12 dígitos)</label>
                    <input type="text" id="inputTitulo" autocomplete="off" maxlength="12" inputmode="numeric"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                           placeholder="Ex: 123456789012" 
                           class="w-full p-4 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button onclick="adicionarFila()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-xl shadow-lg transition-colors">
                    + Adicionar à Fila
                </button>
            </div>
        </section>

        <!-- ABA 2: CADERNO -->
        <section id="aba2" class="tab-content bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">Procurar no Caderno Físico</h2>
            <div id="listaCaderno" class="space-y-4"></div>
        </section>

        <!-- ABA 3: URNA (EXPURGO) -->
        <section id="aba3" class="tab-content bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">Liberar Urna (Expurgo)</h2>
            <div id="listaUrna" class="space-y-4"></div>
        </section>
    </main>

    <script>
        // --- 1. CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB5kvwAoUxUtARIcVlDIiSFe4SEwrn1EwY",
            authDomain: "menosfila-1eda8.firebaseapp.com",
            databaseURL: "https://menosfila-1eda8-default-rtdb.firebaseio.com",
            projectId: "menosfila-1eda8",
            storageBucket: "menosfila-1eda8.firebasestorage.app",
            messagingSenderId: "690115054438",
            appId: "1:690115054438:web:963ff200494fc8666c16a7",
            measurementId: "G-68EB12WPEV"
        };
        
        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let filaEleitores = [];

        // --- 2. NAVEGAÇÃO DAS ABAS ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('header button').forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-800');
                btn.classList.add('text-white');
            });
            document.getElementById(tabId).classList.add('active');
            const btn = document.getElementById(`btn-${tabId}`);
            btn.classList.remove('text-white', 'hover:bg-blue-700');
            btn.classList.add('bg-white', 'text-blue-800');
        }

        // Formata o título de 4 em 4 dígitos
        function formatarTitulo(titulo) {
            if (!titulo || titulo.length !== 12) return titulo;
            return titulo.substring(0, 4) + ' ' + titulo.substring(4, 8) + ' ' + titulo.substring(8, 12);
        }

        // --- 3. REGRAS DE NEGÓCIO (Sincronizadas com Banco) ---
        function adicionarFila() {
            const inputNome = document.getElementById('inputNome');
            const inputTitulo = document.getElementById('inputTitulo');
            const nome = inputNome.value.trim().toUpperCase();
            const titulo = inputTitulo.value.trim();

            if (nome === '' || titulo.length !== 12) {
                return alert("Preencha o Nome e os 12 dígitos do Título.");
            }

            // Envia para o banco de dados
            db.ref('fila').push({
                nome: nome,
                titulo: titulo,
                status: 'aguardando_caderno'
            });

            inputNome.value = '';
            inputTitulo.value = '';
            inputNome.focus();
        }

        function confirmarNoCaderno(id) {
            // Atualiza o status no banco de dados para todos verem
            db.ref('fila/' + id).update({ status: 'aguardando_urna' });
        }

        function confirmarVotoEApagar(id) {
            if(confirm("Confirmar voto? O dado será DELETADO permanentemente.")){
                // EXPURGO: Remove o dado da nuvem instantaneamente
                db.ref('fila/' + id).remove();
            }
        }

        // --- 4. ESCUTADOR EM TEMPO REAL (Atualiza as telas sozinho) ---
        db.ref('fila').on('value', (snapshot) => {
            filaEleitores = [];
            snapshot.forEach((child) => {
                filaEleitores.push({
                    id: child.key, 
                    ...child.val()
                });
            });
            renderizarListas();
        });

        // --- 5. RENDERIZAÇÃO NA TELA ---
        function renderizarListas() {
            const listaCaderno = document.getElementById('listaCaderno');
            const listaUrna = document.getElementById('listaUrna');
            
            listaCaderno.innerHTML = ''; 
            listaUrna.innerHTML = '';
            
            let cadernoVazio = true; 
            let urnaVazia = true;

            filaEleitores.forEach(eleitor => {
                // ABA 2: CADERNO
                if (eleitor.status === 'aguardando_caderno') {
                    cadernoVazio = false;
                    listaCaderno.innerHTML += `
                        <div class="flex justify-between items-center p-4 border-l-4 border-yellow-500 bg-yellow-50 rounded shadow-sm">
                            <div>
                                <p class="text-xl font-bold text-gray-800">${eleitor.nome}</p>
                                <p class="text-gray-700 font-mono tracking-widest font-semibold mt-1 text-lg">${formatarTitulo(eleitor.titulo)}</p>
                            </div>
                            <button onclick="confirmarNoCaderno('${eleitor.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors">
                                Achei ✔
                            </button>
                        </div>`;
                }
                
                // ABA 3: URNA
                if (eleitor.status === 'aguardando_urna') {
                    urnaVazia = false;
                    listaUrna.innerHTML += `
                        <div class="flex justify-between items-center p-4 border-l-4 border-green-500 bg-green-50 rounded shadow-sm">
                            <div>
                                <p class="text-xl font-bold text-gray-800">${eleitor.nome}</p>
                                <p class="text-gray-700 font-mono tracking-widest font-semibold mt-1 text-lg">${formatarTitulo(eleitor.titulo)}</p>
                            </div>
                            <button onclick="confirmarVotoEApagar('${eleitor.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg shadow flex items-center">
                                Votou (Apagar ✖)
                            </button>
                        </div>`;
                }
            });

            if (cadernoVazio) listaCaderno.innerHTML = '<p class="text-gray-500 text-center py-8">Ninguém aguardando no momento.</p>';
            if (urnaVazia) listaUrna.innerHTML = '<p class="text-gray-500 text-center py-8">Ninguém aguardando na urna.</p>';
        }
    </script>
</body>
</html>
