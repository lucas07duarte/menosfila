<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votação - Fila Rápida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes piscar {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .alerta-pisca { animation: piscar 1.5s infinite; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans pb-10">

    <header class="bg-blue-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto p-4">
            
            <div class="flex flex-col md:flex-row justify-between items-center mb-4">
                <h1 class="text-2xl font-bold">Controle de Fluxo</h1>
                
                <div class="mt-2 md:mt-0 bg-blue-900 p-2 rounded-lg flex items-center shadow-inner">
                    <label class="font-semibold mr-3 text-blue-200">Sua Seção:</label>
                    <select id="selectFila" onchange="mudarFila()" class="text-gray-900 font-bold p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
                        <option value="74">Seção 74</option>
                        <option value="75">Seção 75</option>
                        <option value="76">Seção 76</option>
                        <option value="77">Seção 77</option>
                        <option value="78">Seção 78</option>
                    </select>
                </div>
            </div>

            <!-- MENU DE 4 ABAS COM BADGES -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-1 bg-blue-900 p-1 rounded-lg">
                <button onclick="switchTab('aba1')" id="btn-aba1" class="py-3 text-sm md:text-base font-semibold rounded-md bg-white text-blue-800 transition-colors flex items-center justify-center">
                    1. Fila
                </button>
                <button onclick="switchTab('aba2')" id="btn-aba2" class="py-3 text-sm md:text-base font-semibold rounded-md text-white hover:bg-blue-700 transition-colors flex items-center justify-center">
                    2. Caderno
                    <span id="badgeAba2" class="hidden ml-2 bg-yellow-500 text-white rounded-full px-2 py-0.5 text-xs font-bold shadow-lg">0</span>
                </button>
                <button onclick="switchTab('aba3')" id="btn-aba3" class="py-3 text-sm md:text-base font-semibold rounded-md text-white hover:bg-blue-700 transition-colors flex items-center justify-center">
                    3. Urna
                    <span id="badgeAba3" class="hidden ml-2 bg-green-500 text-white rounded-full px-2 py-0.5 text-xs font-bold shadow-lg">0</span>
                </button>
                <button onclick="switchTab('aba4')" id="btn-aba4" class="py-3 text-sm md:text-base font-semibold rounded-md text-white hover:bg-blue-700 transition-colors flex items-center justify-center">
                    4. Busca Geral
                    <span id="badgeAba4" class="hidden ml-2 bg-red-500 text-white rounded-full px-2 py-0.5 text-xs font-bold alerta-pisca shadow-lg">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-4">
        <!-- ABA 1: INSERÇÃO -->
        <section id="aba1" class="tab-content active bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2 flex justify-between items-center">
                <span>Entrada de Eleitor</span>
                <span id="labelFilaAtualAba1" class="text-blue-600 bg-blue-100 px-3 py-1 rounded-full text-sm font-bold">Seção 74</span>
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Nome Completo</label>
                    <input type="text" id="inputNome" autocomplete="off" placeholder="Ex: Maria da Silva" 
                           class="w-full p-4 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Título de Eleitor (12 dígitos)</label>
                    <input type="text" id="inputTitulo" autocomplete="off" maxlength="12" inputmode="numeric"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                           placeholder="Ex: 123456789012" 
                           class="w-full p-4 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
                </div>

                <div class="flex items-center mt-2 p-2 bg-gray-50 rounded border border-gray-200">
                    <input type="checkbox" id="checkSemTitulo" onchange="alternarCampoTitulo()" class="w-6 h-6 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <label for="checkSemTitulo" class="ml-3 text-gray-700 font-medium cursor-pointer">
                        Sem título de eleitor
                    </label>
                </div>

                <div class="flex items-center mt-2 p-3 bg-red-50 rounded border border-red-200">
                    <input type="checkbox" id="checkNaoSabeSecao" onchange="alternarSabeSecao()" class="w-6 h-6 text-red-600 rounded border-red-300 focus:ring-red-500">
                    <label for="checkNaoSabeSecao" class="ml-3 text-red-700 font-bold cursor-pointer">
                        Eleitor NÃO SABE a seção (Enviar para Busca Geral)
                    </label>
                </div>

                <button onclick="adicionarFila()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-xl shadow-lg transition-colors">
                    + Adicionar à Fila
                </button>
            </div>
        </section>

        <!-- ABA 2: CADERNO -->
        <section id="aba2" class="tab-content bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2 flex justify-between items-center">
                <span>Procurar no Caderno</span>
                <span id="labelFilaAtualAba2" class="text-yellow-600 bg-yellow-100 px-3 py-1 rounded-full text-sm font-bold">Seção 74</span>
            </h2>
            <div id="listaCaderno" class="space-y-4"></div>
        </section>

        <!-- ABA 3: URNA (EXPURGO) -->
        <section id="aba3" class="tab-content bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2 flex justify-between items-center">
                <span>Liberar Urna (Expurgo)</span>
                <span id="labelFilaAtualAba3" class="text-green-600 bg-green-100 px-3 py-1 rounded-full text-sm font-bold">Seção 74</span>
            </h2>
            <div id="listaUrna" class="space-y-4"></div>
        </section>

        <!-- ABA 4: BUSCA GERAL -->
        <section id="aba4" class="tab-content bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-red-700 mb-2 border-b pb-2 flex justify-between items-center">
                <span>Busca Geral (Eleitores Perdidos)</span>
            </h2>
            <p class="text-gray-600 mb-6 text-sm">Estas pessoas foram rejeitadas por outras seções ou não sabem sua seção original.</p>
            <div id="listaRejeitados" class="space-y-4"></div>
        </section>
    </main>

    <script>
        // --- 1. CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB5kvwAoUxUtARIcVlDIiSFe4SEwrn1EwY",
            authDomain: "menosfila-1eda8.firebaseapp.com",
            databaseURL: "https://menosfila-1eda8-default-rtdb.firebaseio.com",
            projectId: "menosfila-1eda8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let filaEleitores = []; 
        let filaRejeitados = []; 
        let filaAtual = document.getElementById('selectFila').value;

        // --- 2. LÓGICA DE MÚLTIPLAS FILAS ---
        function mudarFila() {
            db.ref('filas/' + filaAtual).off(); 
            filaAtual = document.getElementById('selectFila').value;
            
            document.getElementById('labelFilaAtualAba1').innerText = "Seção " + filaAtual;
            document.getElementById('labelFilaAtualAba2').innerText = "Seção " + filaAtual;
            document.getElementById('labelFilaAtualAba3').innerText = "Seção " + filaAtual;
            
            filaEleitores = [];
            escutarFilaFirebase();
            renderizarListas();
        }

        // --- 3. NAVEGAÇÃO E INTERFACE ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('header button').forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-800');
                btn.classList.add('text-white');
            });
            document.getElementById(tabId).classList.add('active');
            const btn = document.getElementById(`btn-${tabId}`);
            btn.classList.remove('text-white', 'hover:bg-blue-700');
            btn.classList.add('bg-white', 'text-blue-800');
        }

        function alternarCampoTitulo() {
            const check = document.getElementById('checkSemTitulo').checked;
            const inputTitulo = document.getElementById('inputTitulo');
            if (check) {
                inputTitulo.disabled = true; inputTitulo.value = '';
                inputTitulo.classList.add('bg-gray-200'); inputTitulo.placeholder = "Dispensado";
            } else {
                inputTitulo.disabled = false;
                inputTitulo.classList.remove('bg-gray-200'); inputTitulo.placeholder = "Ex: 123456789012";
            }
        }

        function alternarSabeSecao() {
            const perdido = document.getElementById('checkNaoSabeSecao').checked;
            const checkSemTitulo = document.getElementById('checkSemTitulo');
            
            if (perdido) {
                checkSemTitulo.checked = true;
                checkSemTitulo.disabled = true;
                alternarCampoTitulo();
            } else {
                checkSemTitulo.disabled = false;
                checkSemTitulo.checked = false;
                alternarCampoTitulo();
            }
        }

        function formatarTitulo(titulo) {
            if (titulo === "SEM_TITULO" || titulo === "DESCONHECIDO") return "📄 SEM TÍTULO / DESCONHECIDO"; 
            if (!titulo || titulo.length !== 12) return titulo;
            return titulo.substring(0, 4) + ' ' + titulo.substring(4, 8) + ' ' + titulo.substring(8, 12);
        }

        // --- 4. REGRAS DE NEGÓCIO ---
        function adicionarFila() {
            const inputNome = document.getElementById('inputNome');
            const inputTitulo = document.getElementById('inputTitulo');
            const perdido = document.getElementById('checkNaoSabeSecao').checked;
            const semTitulo = document.getElementById('checkSemTitulo').checked;
            
            const nome = inputNome.value.trim().toUpperCase();
            let titulo = inputTitulo.value.trim();

            if (nome === '') return alert("Preencha o Nome do eleitor.");
            if (!perdido && semTitulo) titulo = "SEM_TITULO"; 
            if (perdido) titulo = "DESCONHECIDO";
            if (!semTitulo && !perdido && titulo.length !== 12) return alert("Preencha os 12 dígitos.");

            const destino = perdido ? db.ref('fila_geral') : db.ref('filas/' + filaAtual);
            
            destino.push({
                nome: nome,
                titulo: titulo,
                status: 'aguardando_caderno'
            }).then(() => {
                inputNome.value = '';
                document.getElementById('checkNaoSabeSecao').checked = false;
                document.getElementById('checkSemTitulo').checked = false;
                document.getElementById('checkSemTitulo').disabled = false;
                alternarCampoTitulo();
                inputNome.focus();
            }).catch((error) => {
                alert("ERRO: " + error.message);
            });
        }

        function confirmarNoCaderno(id) {
            db.ref('filas/' + filaAtual + '/' + id).update({ status: 'aguardando_urna' });
        }

        function rejeitarDaSecao(id) {
            const eleitor = filaEleitores.find(e => e.id === id);
            if(eleitor) {
                db.ref('filas/' + filaAtual + '/' + id).remove();
                db.ref('fila_geral').push({
                    nome: eleitor.nome,
                    titulo: eleitor.titulo,
                    status: 'aguardando_caderno',
                    origem_rejeicao: filaAtual
                });
            }
        }

        function confirmarVotoEApagar(id) {
            db.ref('filas/' + filaAtual + '/' + id).remove();
        }

        function aceitarDaBuscaGeral(id) {
            const eleitor = filaRejeitados.find(e => e.id === id);
            if(eleitor) {
                db.ref('filas/' + filaAtual).push({
                    nome: eleitor.nome,
                    titulo: eleitor.titulo,
                    status: 'aguardando_urna'
                });
                db.ref('fila_geral/' + id).remove();
            }
        }

        function negarDaBuscaGeral(id) {
            db.ref('fila_geral/' + id + '/negado_por/' + filaAtual).set(true);
        }

        // --- 5. ESCUTADORES EM TEMPO REAL ---
        function escutarFilaFirebase() {
            db.ref('filas/' + filaAtual).on('value', (snapshot) => {
                filaEleitores = [];
                snapshot.forEach((child) => {
                    filaEleitores.push({ id: child.key, ...child.val() });
                });
                renderizarListas();
            });
        }

        db.ref('fila_geral').on('value', (snapshot) => {
            filaRejeitados = [];
            snapshot.forEach((child) => {
                filaRejeitados.push({ id: child.key, ...child.val() });
            });
            renderizarListas();
        });

        window.onload = () => { escutarFilaFirebase(); };

        // --- 6. RENDERIZAÇÃO NA TELA ---
        function renderizarListas() {
            const listaCaderno = document.getElementById('listaCaderno');
            const listaUrna = document.getElementById('listaUrna');
            const listaRejeitados = document.getElementById('listaRejeitados');
            
            listaCaderno.innerHTML = ''; listaUrna.innerHTML = ''; listaRejeitados.innerHTML = '';
            
            let qtdCaderno = 0; 
            let qtdUrna = 0; 
            let rejeitadosVisiveis = 0;

            filaEleitores.forEach(eleitor => {
                if (eleitor.status === 'aguardando_caderno') {
                    qtdCaderno++;
                    listaCaderno.innerHTML += `
                        <div class="flex flex-col md:flex-row justify-between items-center p-4 border-l-4 border-yellow-500 bg-yellow-50 rounded shadow-sm gap-4">
                            <div class="text-center md:text-left w-full">
                                <p class="text-xl font-bold text-gray-800">${eleitor.nome}</p>
                                <p class="text-gray-700 font-mono tracking-widest font-semibold mt-1">${formatarTitulo(eleitor.titulo)}</p>
                            </div>
                            <div class="flex flex-col sm:flex-row w-full md:w-auto gap-2">
                                <button onclick="rejeitarDaSecao('${eleitor.id}')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-4 rounded transition-colors whitespace-nowrap">
                                    Não é daqui ❌
                                </button>
                                <button onclick="confirmarNoCaderno('${eleitor.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded transition-colors whitespace-nowrap">
                                    Achei ✔
                                </button>
                            </div>
                        </div>`;
                }
                if (eleitor.status === 'aguardando_urna') {
                    qtdUrna++;
                    listaUrna.innerHTML += `
                        <div class="flex justify-between items-center p-4 border-l-4 border-green-500 bg-green-50 rounded shadow-sm">
                            <div>
                                <p class="text-xl font-bold text-gray-800">${eleitor.nome}</p>
                                <p class="text-gray-700 font-mono tracking-widest font-semibold mt-1">${formatarTitulo(eleitor.titulo)}</p>
                            </div>
                            <button onclick="confirmarVotoEApagar('${eleitor.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded shadow flex items-center">
                                Votou (Apagar ✖)
                            </button>
                        </div>`;
                }
            });

            filaRejeitados.forEach(eleitor => {
                if (!eleitor.negado_por || !eleitor.negado_por[filaAtual]) {
                    rejeitadosVisiveis++;
                    listaRejeitados.innerHTML += `
                        <div class="flex flex-col md:flex-row justify-between items-center p-4 border-l-4 border-red-500 bg-red-50 rounded shadow-sm gap-4">
                            <div class="text-center md:text-left w-full">
                                <p class="text-xl font-bold text-gray-800">${eleitor.nome}</p>
                                <p class="text-gray-700 font-mono tracking-widest font-semibold mt-1">${formatarTitulo(eleitor.titulo)}</p>
                                ${eleitor.origem_rejeicao ? `<p class="text-xs text-red-600 mt-1">Rejeitado pela seção ${eleitor.origem_rejeicao}</p>` : ''}
                            </div>
                            <div class="flex flex-col sm:flex-row w-full md:w-auto gap-2">
                                <button onclick="negarDaBuscaGeral('${eleitor.id}')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-4 rounded transition-colors whitespace-nowrap">
                                    Também não é daqui ❌
                                </button>
                                <button onclick="aceitarDaBuscaGeral('${eleitor.id}')" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded transition-colors whitespace-nowrap">
                                    Achei, puxar pra cá ✔
                                </button>
                            </div>
                        </div>`;
                }
            });

            // Exibição de listas vazias
            if (qtdCaderno === 0) listaCaderno.innerHTML = '<p class="text-gray-500 text-center py-8">Ninguém aguardando na Seção ' + filaAtual + '.</p>';
            if (qtdUrna === 0) listaUrna.innerHTML = '<p class="text-gray-500 text-center py-8">Ninguém aguardando na Seção ' + filaAtual + '.</p>';
            if (rejeitadosVisiveis === 0) listaRejeitados.innerHTML = '<p class="text-gray-500 text-center py-8">Ninguém perdido no momento.</p>';

            // Controle dos Alertas Visuais (Badges nas abas)
            const badge2 = document.getElementById('badgeAba2');
            if (qtdCaderno > 0) {
                badge2.classList.remove('hidden');
                badge2.innerText = qtdCaderno;
            } else {
                badge2.classList.add('hidden');
            }

            const badge3 = document.getElementById('badgeAba3');
            if (qtdUrna > 0) {
                badge3.classList.remove('hidden');
                badge3.innerText = qtdUrna;
            } else {
                badge3.classList.add('hidden');
            }

            const badge4 = document.getElementById('badgeAba4');
            if (rejeitadosVisiveis > 0) {
                badge4.classList.remove('hidden');
                badge4.innerText = rejeitadosVisiveis;
            } else {
                badge4.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
